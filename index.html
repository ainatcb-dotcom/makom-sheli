<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איפה המקום שלי?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one centered column, a stepper that moves intro → 6 questions → personal profile + compass + checklist */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #1b2233;
  --muted: #5d6679;
  --line: #dde2ec;
  --accent: #1d3f72;
  --p1: #1f6fb2; --p1-soft: #e3eef9;
  --p2: #d9701a; --p2-soft: #fcecdd;
  --p3: #7447b0; --p3-soft: #eee6f8;
  --p4: #cc3a66; --p4-soft: #fae3ea;
  --p5: #23895d; --p5-soft: #dff2e8;
  --display: "Suez One", "Assistant", "Arial Hebrew", serif;
  --body: "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141c; --surface: #1a1f2b; --ink: #e8ebf2; --muted: #9aa3b6; --line: #2c3344; --accent: #9cbcf0;
  --p1: #5ea4e6; --p1-soft: #1a2c40; --p2: #f0994f; --p2-soft: #3a2817; --p3: #ad8be0; --p3-soft: #2c2340;
  --p4: #ec7397; --p4-soft: #3d1f2a; --p5: #5cc795; --p5-soft: #173326; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11141c; --surface: #1a1f2b; --ink: #e8ebf2; --muted: #9aa3b6; --line: #2c3344; --accent: #9cbcf0;
  --p1: #5ea4e6; --p1-soft: #1a2c40; --p2: #f0994f; --p2-soft: #3a2817; --p3: #ad8be0; --p3-soft: #2c2340;
  --p4: #ec7397; --p4-soft: #3d1f2a; --p5: #5cc795; --p5-soft: #173326; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3rem); }
h2 { font-size: clamp(1.45rem, 4vw, 1.9rem); }
h3 { font-size: 1.25rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-weight: 700; font-size: .85rem; letter-spacing: .04em; color: var(--accent); }

button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; background: var(--accent); color: var(--surface); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 16px; font-size: .9rem; }

/* intro */
.hero { display: flex; flex-direction: column; gap: 18px; padding-block: 12px 8px; }
.hero .tag { font-family: var(--display); font-size: 1.2rem; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px; font-weight: 700; font-size: .95rem; }
.chip svg { width: 22px; height: 22px; flex: none; }

/* question */
.progress { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--accent); }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--muted); }
.opt .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.opt[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.opt[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 6px; border: 3px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.opt.locked { opacity: .45; }
.nav { display: flex; justify-content: space-between; gap: 12px; }
.hint { font-size: .95rem; min-height: 1.6em; }

/* results */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 30px minmax(0, 1fr) 2ch; align-items: center; gap: 10px; }
.bar svg { width: 30px; height: 30px; }
.bar .lbl { font-weight: 700; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bar .track { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; transition: width .6s ease; }
.bar .n { font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
.bar.top .lbl::after { content: none; }

.profile { border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; border: 2px solid; background: var(--surface); }
.profile .ph { display: flex; align-items: center; gap: 14px; }
.profile .ph svg { width: 54px; height: 54px; flex: none; }
.profile .ph .kicker { font-weight: 700; font-size: .9rem; }
.profile ul { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 2px; }
.profile h4 { margin: 0; font-size: 1rem; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.ask { display: flex; flex-direction: column; gap: 8px; }
.ask-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.ask-row q { font-style: italic; quotes: "״" "״"; min-width: 0; }
.add { border: 1.5px solid currentColor; background: transparent; border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 700; white-space: nowrap; flex: none; }
.add[disabled] { opacity: .6; cursor: default; }

details.more { border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; padding: 14px 0; font-weight: 700; display: flex; align-items: center; gap: 10px; }
details.more summary svg { width: 26px; height: 26px; }
details.more .profile { margin-bottom: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
textarea { font: inherit; font-size: 1rem; width: 100%; min-height: 70px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--ink); }
.checklist { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; border-radius: 6px; }
.checklist input { width: 20px; height: 20px; margin-top: 4px; accent-color: var(--accent); flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.closing { font-family: var(--display); font-size: 1.35rem; text-align: center; color: var(--accent); text-wrap: balance; padding-block: 8px; }
.toast { font-weight: 700; color: var(--p5); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const P = {
  a: { name: "מקום לצמוח ולהצטיין", c: "p1",
    text: "חשוב לך ללמוד, להתקדם, להתמודד עם אתגרים ולמצות את היכולות שלך. כדאי לך לחפש בית ספר שיפתח בפניך אופקים ויעודד אותך להגיע רחוק.",
    check: ["מגמות ומסלולי לימוד", "תוכניות מצוינות והעשרה", "אפשרויות להתקדמות ולהעמקה"],
    ask: ["אילו מגמות ותוכניות מצוינות יש אצלכם?", "איך אתם מקדמים תלמידים שרוצים ללמוד מעבר לנדרש?"],
    icon: '<path d="M6 34 L18 18 L25 26 L34 12" /><path d="M27 12 H34 V19" /><path d="M6 38 H38" />' },
  b: { name: "מקום להרגיש שייך", c: "p2",
    text: "חשוב לך להרגיש חלק מקבוצה, ליצור חברויות וליהנות מחוויות משותפות. האווירה החברתית היא חלק משמעותי מחוויית הלמידה שלך.",
    check: ["האווירה החברתית", "פעילויות, טיולים ומסעות", "השתלבות תלמידים חדשים", "חיי הפנימייה, אם קיימת"],
    ask: ["איך עוזרים לתלמידים חדשים להשתלב?", "אילו פעילויות חברתיות מתקיימות במהלך השנה?"],
    icon: '<circle cx="14" cy="14" r="5" /><circle cx="30" cy="14" r="5" /><path d="M4 34 C4 26 9 22 14 22 C19 22 22 25 22 29" /><path d="M22 29 C22 25 25 22 30 22 C35 22 40 26 40 34" /><circle cx="22" cy="24" r="4" /><path d="M14 38 C14 33 17 30 22 30 C27 30 30 33 30 38" />' },
  c: { name: "מקום עם משמעות", c: "p3",
    text: "חשוב לך שבית הספר יהיה יותר ממקום שלומדים בו. יש לך רצון לגבש זהות, להתחבר לערכים ולגלות את הדרך שלך בעולם.",
    check: ["התפיסה החינוכית והרוחנית", "האווירה הערכית והתורנית", "התנדבות ומעורבות חברתית"],
    ask: ["איך הערכים שלכם באים לידי ביטוי ביום־יום?", "אילו הזדמנויות יש לתלמידים לתרום ולהשפיע?"],
    icon: '<circle cx="22" cy="22" r="16" /><path d="M22 10 L26 22 L22 34 L18 22 Z" /><circle cx="22" cy="22" r="1.5" />' },
  d: { name: "מקום להביא את עצמי", c: "p4",
    text: "חשוב לך לגלות את הכישרונות שלך, להתנסות, ליצור ולבחור. כדאי לך לחפש מקום שנותן מרחב ליוזמה, לסקרנות ולביטוי אישי.",
    check: ["מסלולים ומגמות ייחודיים", "אפשרויות בחירה", "למידה מעשית ויצירתית", "חוגים ויוזמות תלמידים"],
    ask: ["איפה יש לתלמידים אפשרות לבחור וליזום?", "איך אוכל לפתח אצלכם את תחומי העניין שלי?"],
    icon: '<path d="M22 6 L25 17 L36 20 L25 23 L22 34 L19 23 L8 20 L19 17 Z" /><path d="M35 30 L36.5 34 L40 35 L36.5 36 L35 40 L33.5 36 L30 35 L33.5 34 Z" />' },
  e: { name: "מקום שרואה אותי", c: "p5",
    text: "חשוב לך להרגיש שרואים אותך, מקשיבים לך ומאמינים בך. כדאי לך לחפש סביבה שתעניק לך ביטחון ותאפשר לך להתפתח מתוך קשר אישי.",
    check: ["הקשר בין הצוות לתלמידים", "ליווי אישי ורגשי", "מענים לימודיים מותאמים", "תחושת הביטחון במוסד"],
    ask: ["למי אוכל לפנות כשאני מתמודד עם קושי?", "איך אתם מצליחים להכיר כל תלמיד באופן אישי?"],
    icon: '<path d="M4 22 C10 12 16 9 22 9 C28 9 34 12 40 22 C34 32 28 35 22 35 C16 35 10 32 4 22 Z" /><circle cx="22" cy="22" r="6" /><circle cx="22" cy="22" r="1.5" />' }
};
const KEYS = ["a","b","c","d","e"];
const HEB = { a: "א׳", b: "ב׳", c: "ג׳", d: "ד׳", e: "ה׳" };

const Q = [
  ["מה יגרום לי לקום בבוקר בכיף לבית הספר?", [
    "הידיעה שאני הולך ללמוד דברים מעניינים ומאתגרים", "לפגוש את החברים שלי ולהרגיש חלק מחבורה",
    "להיות במקום שיש בו משמעות וערכים שאני מתחבר אליהם", "לעסוק בדברים שאני אוהב ולפתח את הכישרונות שלי",
    "לדעת שיש מי שמכיר אותי ושם לב אליי"]],
  ["איך נראה יום לימודים מוצלח מבחינתי?", [
    "למדתי משהו חדש והרגשתי שהתקדמתי", "צחקתי, נהניתי ועשיתי דברים עם חברים",
    "הייתה לי שיחה משמעותית או עשייה ערכית", "יצרתי, יזמתי או התנסיתי במשהו חדש", "הרגשתי בנוח להיות מי שאני"]],
  ["מה הכי חשוב לי שיהיה בבית הספר הבא שלי?", [
    "מגמות מעניינות ורמה לימודית גבוהה", "חיי חברה עשירים ואווירה טובה",
    "זהות חינוכית וערכית שאני מזדהה איתה", "אפשרויות בחירה ומסלולים מיוחדים", "יחס אישי ומענה לצרכים שלי"]],
  ["כשאני חושב על המורים שלי, הייתי רוצה שהם...", [
    "יאתגרו אותי וידחפו אותי להצליח", "ייצרו אווירה טובה ומגבשת בכיתה",
    "יהיו עבורי דמויות משמעותיות ומעוררות השראה", "יעודדו אותי לחשוב אחרת וליזום", "יכירו אותי ויהיו שם בשבילי כשאצטרך"]],
  ["מה הייתי רוצה לעשות מעבר לשיעורים הרגילים?", [
    "להשתתף בתוכניות העשרה ומצוינות", "לצאת לטיולים, מסעות ופעילויות חברתיות",
    "להתנדב, לתרום ולהעמיק בעולם הערכים שלי", "לעסוק בספורט, מוזיקה, אמנות, טכנולוגיה או יזמות",
    "ליהנות מזמן וממרחב להתפתחות בקצב שלי"]],
  ["כשאסיים את התיכון, מה הכי הייתי רוצה להגיד?", [
    "הגעתי להישגים שאני גאה בהם", "רכשתי חברים שילוו אותי לאורך החיים",
    "גיבשתי את הזהות שלי ואת הדרך שבה אני מאמין", "גיליתי במה אני טוב ומה אני אוהב לעשות",
    "צברתי ביטחון בעצמי ולמדתי להאמין ביכולות שלי"]]
];

const CHECKLIST = ["מרחק מהבית וזמן נסיעה", "הסעות ותחבורה ציבורית", "פנימייה – האם יש, ואיך היא נראית",
  "תנאי קבלה ומועדי הרשמה", "ימי פתוחים ומפגשי היכרות", "עלויות ותשלומי הורים",
  "גודל בית הספר ומספר תלמידים בכיתה", "שעות הלימודים ומבנה השבוע"];
const COMPASS = [
  ["c1", "שני הדברים שהכי חשובים לי בבית הספר הבא שלי:"],
  ["c2", "דבר אחד שאני לא רוצה לוותר עליו:"],
  ["c3", "שאלות שאני רוצה לשאול את נציגי בתי הספר:"],
  ["c4", "משהו שאני עדיין מתלבט לגביו:"]
];

const store = {
  get(k, d) { try { const v = localStorage.getItem("makom:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("makom:" + k, JSON.stringify(v)); } catch {} }
};

let S = store.get("state", null) || { step: 0, picks: Q.map(() => []), order: null };
if (!S.order) S.order = Q.map(() => shuffle([0,1,2,3,4]));
let compass = store.get("compass", {});
let checks = store.get("checks", {});
function save() { store.set("state", S); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const icon = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 44 44" fill="none" stroke="var(--${P[k].c})" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k].icon}</svg>`;
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function render() {
  if (S.step === 0) return renderIntro();
  if (S.step <= Q.length) return renderQuestion(S.step - 1);
  renderResults();
}

function renderIntro() {
  app.innerHTML = `
    <section class="hero">
      <span class="tag">בבנימין עושים מקום לכולם</span>
      <h1>בחן את עצמך – איפה המקום שלי?</h1>
      <p>לפניך שש שאלות קצרות שיעזרו לך להבין מה באמת חשוב לך בבית הספר הבא שלך. בכל שאלה אפשר לבחור עד שתי תשובות שהכי מדברות אליך.</p>
      <p class="muted">בסוף תקבלו פרופיל אישי, רשימת דברים שכדאי לבדוק ושאלות מוכנות לדוכנים של בתי הספר.</p>
      <div class="chips">${KEYS.map(k => `<span class="chip" style="background:var(--${P[k].c}-soft);color:var(--${P[k].c})">${icon(k)}${P[k].name}</span>`).join("")}</div>
      <div class="row"><button class="btn" id="start">${S.picks.some(p => p.length) ? "להמשיך מאיפה שעצרתי" : "בואו נתחיל"}</button></div>
    </section>`;
  document.getElementById("start").onclick = () => {
    const firstEmpty = S.picks.findIndex(p => !p.length);
    S.step = firstEmpty === -1 ? Q.length + 1 : firstEmpty + 1; save(); render(); window.scrollTo(0, 0);
  };
}

function renderQuestion(i) {
  const [title, opts] = Q[i];
  const picks = S.picks[i];
  app.innerHTML = `
    <section class="stack">
      <div class="progress" aria-hidden="true">${Q.map((_, j) => `<span class="${j <= i ? "done" : ""}"></span>`).join("")}</div>
      <div class="qhead"><span class="eyebrow">שאלה ${i + 1} מתוך ${Q.length}</span><span class="muted" style="font-size:.95rem">אפשר לבחור עד שתי תשובות</span></div>
      <h2 id="qt">${title}</h2>
      <div class="options" role="group" aria-labelledby="qt">
        ${S.order[i].map(o => {
          const on = picks.includes(o);
          const locked = !on && picks.length >= 2;
          return `<button class="opt${locked ? " locked" : ""}" data-o="${o}" aria-pressed="${on}"><span class="box"></span><span>${opts[o]}</span></button>`;
        }).join("")}
      </div>
      <p class="hint muted" id="hint">${picks.length >= 2 ? "בחרת שתי תשובות. כדי להחליף, בטלו אחת מהן." : ""}</p>
      <div class="nav">
        <button class="btn ghost" id="back">הקודם</button>
        <button class="btn" id="next" ${picks.length ? "" : "disabled"}>${i === Q.length - 1 ? "לפרופיל שלי" : "הבא"}</button>
      </div>
    </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const o = +b.dataset.o, idx = picks.indexOf(o);
    if (idx > -1) picks.splice(idx, 1);
    else if (picks.length < 2) picks.push(o);
    else { document.getElementById("hint").textContent = "אפשר לבחור עד שתי תשובות. בטלו אחת כדי לבחור אחרת."; return; }
    save(); renderQuestion(i);
    app.querySelector(`.opt[data-o="${o}"]`)?.focus();
  });
  document.getElementById("back").onclick = () => { S.step--; save(); render(); window.scrollTo(0, 0); };
  document.getElementById("next").onclick = () => { S.step++; save(); render(); window.scrollTo(0, 0); };
}

function profileCard(k, kicker) {
  const p = P[k], col = `var(--${p.c})`;
  const inCompass = (compass.c3 || "");
  return `
    <article class="profile" style="border-color:${col}">
      <div class="ph">${icon(k)}<div><div class="kicker" style="color:${col}">${kicker}</div><h3>${p.name}</h3></div></div>
      <p>${p.text}</p>
      <div class="cols">
        <div><h4>מה כדאי לך לבדוק?</h4><ul>${p.check.map(c => `<li>${c}</li>`).join("")}</ul></div>
        <div class="ask"><h4>מה כדאי לך לשאול בדוכן?</h4>
          ${p.ask.map(a => `<div class="ask-row"><q>${a}</q><button class="add" style="color:${col}" data-q="${esc(a)}" ${inCompass.includes(a) ? "disabled" : ""}>${inCompass.includes(a) ? "נוסף ✓" : "+ למצפן"}</button></div>`).join("")}
        </div>
      </div>
    </article>`;
}

function renderResults() {
  const count = Object.fromEntries(KEYS.map(k => [k, 0]));
  S.picks.forEach(p => p.forEach(o => count[KEYS[o]]++));
  const max = Math.max(...KEYS.map(k => count[k]));
  const top = KEYS.filter(k => count[k] === max && max > 0);
  const rest = KEYS.filter(k => !top.includes(k)).sort((x, y) => count[y] - count[x]);
  const scale = Math.max(max, 1);

  app.innerHTML = `
    <section class="stack">
      <span class="eyebrow">הפענוח – מה הבחירות שלי מספרות עליי?</span>
      <h1>${top.length === 1 ? "המקום שלי: " + P[top[0]].name : "המקום שלי משלב כמה דברים"}</h1>

      <div class="panel">
        <h3>פרופיל הבחירה שלי</h3>
        <div class="bars">
          ${KEYS.map(k => `<div class="bar">${icon(k)}
            <div class="lbl"><span>${HEB[k]} – ${P[k].name}</span><div class="track"><div class="fill" style="width:${count[k] / scale * 100}%;background:var(--${P[k].c})"></div></div></div>
            <span class="n">${count[k]}</span></div>`).join("")}
        </div>
      </div>

      ${top.map(k => profileCard(k, top.length > 1 ? "אחד הדברים הבולטים אצלך" : "בחרת בעיקר " + HEB[k])).join("")}

      <div class="panel">
        <h3>${top.length > 1 ? "קיבלת את התוצאה הגבוהה ביותר בכמה קטגוריות?" : "וגם זה חלק ממך"}</h3>
        <p>${top.length > 1 ? "מעולה! " : ""}כולנו מורכבים מכמה רצונות וצרכים. יכול להיות שחשוב לך גם להצטיין וגם להרגיש שייך, או גם לפתח את הכישרונות שלך וגם לגדול בסביבה ערכית.</p>
        <p>המטרה היא לא להכניס אותך למשבצת, אלא לעזור לך להבין מה לחפש.</p>
      </div>

      <div>
        <h3 style="margin-bottom:8px">שאר הפרופילים</h3>
        ${rest.map(k => `<details class="more"><summary>${icon(k)}<span>${P[k].name}</span><span class="muted" style="font-weight:400">· ${count[k]} בחירות</span></summary>${profileCard(k, HEB[k])}</details>`).join("")}
      </div>

      <div class="panel" id="compass">
        <h2>רגע לפני שיוצאים לדוכנים – המצפן האישי שלי</h2>
        <p class="muted">מה שתכתבו כאן נשמר בדפדפן הזה. אפשר להעתיק הכול ולשמור בטלפון.</p>
        ${COMPASS.map(([id, l]) => `<div class="field"><label for="${id}">${l}</label><textarea id="${id}" rows="${id === "c3" ? 4 : 2}">${esc(compass[id] || "")}</textarea></div>`).join("")}
        <div class="row"><button class="btn small" id="copy">העתקת המצפן</button><span class="toast" id="toast" role="status"></span></div>
      </div>

      <div class="panel">
        <h2>צ׳ק ליסט פרקטי – לכולם</h2>
        <p class="muted">בלי קשר לפרופיל, את הדברים האלה כדאי לבדוק בכל בית ספר.</p>
        <div class="checklist">
          ${CHECKLIST.map((c, j) => `<label><input type="checkbox" id="ck${j}" ${checks[j] ? "checked" : ""}><span>${c}</span></label>`).join("")}
        </div>
      </div>

      <p class="closing">יש הרבה בתי ספר טובים. עכשיו הזמן לגלות מה הופך בית ספר לטוב בשבילך.</p>
      <div class="row" style="justify-content:center">
        <button class="btn ghost small" id="edit">לשנות תשובות</button>
        <button class="btn ghost small" id="restart">להתחיל מחדש</button>
      </div>
    </section>`;

  COMPASS.forEach(([id]) => document.getElementById(id).addEventListener("input", e => { compass[id] = e.target.value; store.set("compass", compass); }));
  CHECKLIST.forEach((_, j) => document.getElementById("ck" + j).onchange = e => { checks[j] = e.target.checked; store.set("checks", checks); });
  app.querySelectorAll(".add").forEach(b => b.onclick = () => {
    const q = b.dataset.q, ta = document.getElementById("c3");
    ta.value = (ta.value.trim() ? ta.value.trimEnd() + "\n" : "") + "• " + q;
    compass.c3 = ta.value; store.set("compass", compass);
    app.querySelectorAll(`.add`).forEach(x => { if (x.dataset.q === q) { x.disabled = true; x.textContent = "נוסף ✓"; } });
  });
  document.getElementById("copy").onclick = () => {
    const text = "המצפן האישי שלי\n" + (top.length ? "הפרופיל שלי: " + top.map(k => P[k].name).join(" + ") + "\n\n" : "\n") +
      COMPASS.map(([id, l]) => l + "\n" + (document.getElementById(id).value.trim() || "—")).join("\n\n");
    const toast = document.getElementById("toast");
    navigator.clipboard.writeText(text).then(() => { toast.textContent = "הועתק"; },
      () => { const ta = document.getElementById("c1"); ta.focus(); ta.select(); toast.textContent = "ההעתקה לא עבדה כאן. סמנו את הטקסט והעתיקו ידנית."; });
  };
  document.getElementById("edit").onclick = () => { S.step = 1; save(); render(); window.scrollTo(0, 0); };
  document.getElementById("restart").onclick = function () {
    if (this.dataset.armed) {
      S = { step: 0, picks: Q.map(() => []), order: Q.map(() => shuffle([0,1,2,3,4])) }; save(); render(); window.scrollTo(0, 0);
    } else { this.dataset.armed = "1"; this.textContent = "בטוח? לחצו שוב לאיפוס התשובות"; }
  };
}

document.documentElement.dir = "rtl";
document.documentElement.lang = "he";
render();
</script>
</body>
</html>
