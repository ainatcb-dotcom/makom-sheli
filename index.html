<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איפה המקום שלי?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column like the campaign's navy "מקום" cards; stepper intro → 6 questions → profile, compass, checklist */
:root {
  --bg: #f6f7f3;
  --surface: #ffffff;
  --ink: #1b3347;
  --muted: #5b6b78;
  --line: #dce3e6;
  --navy: #1d4562;
  --on-navy: #ffffff;
  --yellow: #f7b51e;
  --accent: #1d4562;
  --p1: #c98600; --p1-soft: #fdf1d3;
  --p2: #2a6cc9; --p2-soft: #e2ecfa;
  --p3: #13808a; --p3-soft: #ddf1f1;
  --p4: #3a8f3c; --p4-soft: #e3f2df;
  --p5: #c2487e; --p5-soft: #f9e3ee;
  --display: "Fredoka", "Assistant", "Arial Hebrew", sans-serif;
  --body: "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1c26; --surface: #172836; --ink: #e9eff3; --muted: #9db0bd; --line: #2a3e4e;
  --navy: #1d4562; --on-navy: #ffffff; --yellow: #f7b51e; --accent: #f7b51e;
  --p1: #f5bf3d; --p1-soft: #3a2e12; --p2: #6ea3ef; --p2-soft: #182c47; --p3: #4cc0c8; --p3-soft: #123437;
  --p4: #6fc56f; --p4-soft: #183319; --p5: #ec7fad; --p5-soft: #3b1a2a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1c26; --surface: #172836; --ink: #e9eff3; --muted: #9db0bd; --line: #2a3e4e;
  --navy: #1d4562; --on-navy: #ffffff; --yellow: #f7b51e; --accent: #f7b51e;
  --p1: #f5bf3d; --p1-soft: #3a2e12; --p2: #6ea3ef; --p2-soft: #182c47; --p3: #4cc0c8; --p3-soft: #123437;
  --p4: #6fc56f; --p4-soft: #183319; --p5: #ec7fad; --p5-soft: #3b1a2a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 2.8rem); }
h2 { font-size: clamp(1.4rem, 4vw, 1.8rem); }
h3 { font-size: 1.25rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-weight: 800; font-size: .9rem; letter-spacing: .03em; color: var(--accent); }

button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--yellow); outline-offset: 2px; }
.btn { border: 0; border-radius: 999px; padding: 12px 28px; font-weight: 800; background: var(--yellow); color: #1d4562; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 16px; font-size: .9rem; }

/* intro: navy card echoing the campaign */
.card-navy { background: var(--navy); color: var(--on-navy); border-radius: 18px; padding: 30px 24px; display: flex; flex-direction: column; gap: 14px; }
.card-navy .big { font-family: var(--display); font-weight: 700; font-size: clamp(3.2rem, 14vw, 5.2rem); line-height: .95; }
.card-navy .y { color: var(--yellow); }
.card-navy .line { font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 4.5vw, 1.6rem); line-height: 1.25; }
.card-navy p { color: #dfe8ee; }
.event { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; font-weight: 700; font-size: .95rem; color: var(--on-navy); }
.event b { color: var(--yellow); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px; font-weight: 700; font-size: .95rem; }
.chip svg { width: 22px; height: 22px; flex: none; }

/* question */
.progress { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--yellow); }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--muted); }
.opt .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.opt[aria-pressed="true"] { border-color: var(--yellow); background: color-mix(in srgb, var(--yellow) 14%, var(--surface)); }
.opt[aria-pressed="true"] .box { background: var(--yellow); border-color: var(--yellow); }
.opt[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 6px; border: 3px solid #1d4562; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.opt.locked { opacity: .45; }
.nav { display: flex; justify-content: space-between; gap: 12px; }
.hint { font-size: .95rem; min-height: 1.6em; }

/* results */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 30px minmax(0, 1fr) 2ch; align-items: center; gap: 10px; }
.bar svg { width: 30px; height: 30px; }
.bar .lbl { font-weight: 700; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bar .track { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; transition: width .6s ease; }
.bar .n { font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }

.profile { border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; border: 2px solid; background: var(--surface); }
.profile .ph { display: flex; align-items: center; gap: 14px; }
.profile .ph svg { width: 54px; height: 54px; flex: none; }
.profile .ph .kicker { font-weight: 800; font-size: .95rem; }
.profile ul { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 2px; }
.profile h4 { margin: 0; font-size: 1rem; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.ask { display: flex; flex-direction: column; gap: 8px; }
.ask-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.ask-row q { font-style: italic; quotes: "״" "״"; min-width: 0; }
.add { border: 1.5px solid currentColor; background: transparent; border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 700; white-space: nowrap; flex: none; }
.add[disabled] { opacity: .6; cursor: default; }

details.more { border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; padding: 14px 0; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
details.more summary svg { width: 26px; height: 26px; }
details.more .profile { margin-bottom: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
textarea { font: inherit; font-size: 1rem; width: 100%; min-height: 70px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--ink); }
.checklist { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; border-radius: 6px; }
.checklist input { width: 20px; height: 20px; margin-top: 4px; accent-color: var(--p4); flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.closing { text-align: center; }
.toast { font-weight: 700; color: var(--p4); }

/* campaign graphics */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.logo { background: #ffffff; border-radius: 12px; padding: 6px 10px; display: inline-flex; box-shadow: 0 1px 0 var(--line); }
.logo img { height: 54px; width: auto; display: block; }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--ink); line-height: 1; text-align: left; }
.wordmark b { color: var(--p4); font-weight: 700; }
.chairs { background-color: var(--bg); background-image: var(--chairs); background-size: 230px 230px; border-radius: 20px; padding: 44px 34px; }
.chairs > .card-navy { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bg) 55%, transparent); }
.qmarks { display: inline-flex; gap: 2px; font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1; }
.qmarks span:nth-child(1) { color: var(--p2); transform: rotate(-14deg); }
.qmarks span:nth-child(2) { color: var(--yellow); transform: rotate(10deg) translateY(-6px); }
.qmarks span:nth-child(3) { color: var(--p4); transform: rotate(-6deg); }
.qtitle { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.awards { display: flex; gap: 6px; justify-content: center; }
.awards svg { width: 34px; height: 34px; }
@media (max-width: 480px) { .chairs { padding: 34px 22px; background-size: 170px 170px; } .logo img { height: 44px; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    text: "חשוב לכם להרגיש שרואים אתכם, מקשיבים לכם ומאמינים בכם. חפשו סביבה שתיתן לכם ביטחון ותאפשר לכם לגדול מתוך קשר אישי.",
    check: ["הקשר בין הצוות לתלמידים", "ליווי אישי ורגשי", "מענים לימודיים מותאמים", "תחושת ביטחון במקום"],
    ask: ["למי אפשר לפנות כשקשה?", "איך אתם מכירים כל תלמיד ותלמידה באופן אישי?"],
    icon: '<path d="M22 40 V20" /><path d="M22 26 C22 18 16 14 8 14 C8 22 14 26 22 26 Z" /><path d="M22 20 C22 12 28 8 36 8 C36 16 30 20 22 20 Z" /><path d="M12 40 H32" />' }
};
const KEYS = ["a","b","c","d","e"];
const HEB = { a: "א׳", b: "ב׳", c: "ג׳", d: "ד׳", e: "ה׳" };

const Q = [
  ["מה יגרום לי לקום בבוקר בכיף?", [
    "שיעורים מעניינים שמאתגרים אותי", "החבר׳ה שמחכים לי",
    "מקום עם ערכים שמדברים אליי", "זמן לתחביבים ולכישרונות שלי",
    "יש שם מי שמכיר אותי ושם לב אליי"]],
  ["יום מוצלח בבית הספר הוא יום ש...", [
    "למדתי משהו חדש והרגשתי שהתקדמתי", "צחקתי, נהניתי ועשיתי דברים עם חברים",
    "הייתה לי שיחה משמעותית או עשייה ערכית", "יצרתי, יזמתי או ניסיתי משהו חדש", "הרגשתי בנוח להיות מי שאני"]],
  ["מה חייב להיות במקום הבא שלי?", [
    "מגמות מעניינות ורמה לימודית גבוהה", "חיי חברה עשירים ואווירה טובה",
    "זהות חינוכית וערכית שמתאימה לי", "מסלולים מיוחדים והרבה אפשרויות בחירה", "יחס אישי ומענה לצרכים שלי"]],
  ["המורים שהייתי רוצה לפגוש...", [
    "מאתגרים אותי ודוחפים אותי להצליח", "יוצרים כיתה מגובשת ואווירה טובה",
    "דמויות משמעותיות שאפשר ללמוד מהן", "מעודדים לחשוב אחרת וליזום", "מכירים אותי ונמצאים שם כשצריך"]],
  ["ומה קורה מחוץ לכיתה?", [
    "תוכניות העשרה ומצוינות", "טיולים, מסעות ופעילויות חברתיות",
    "התנדבות, תרומה והעמקה בעולם הערכים", "ספורט, מוזיקה, אמנות, טכנולוגיה או יזמות",
    "זמן ומרחב להתפתח בקצב שלי"]],
  ["סיימתי תיכון. מה הכי הייתי רוצה להגיד?", [
    "הגעתי להישגים שאני גאה בהם", "יש לי חברים לכל החיים",
    "גיבשתי זהות ודרך שמתאימה לי", "גיליתי את הכישרונות ואת התשוקות שלי",
    "צברתי ביטחון ולמדתי להאמין ביכולות שלי"]]
];

const CHECKLIST = ["מרחק מהבית וזמן נסיעה", "הסעות ותחבורה ציבורית", "פנימייה: האם יש, ואיך היא נראית",
  "תנאי קבלה ומועדי הרשמה", "ימים פתוחים ומפגשי היכרות", "עלויות ותשלומי הורים",
  "גודל בית הספר ומספר תלמידים בכיתה", "שעות הלימודים ומבנה השבוע"];
const COMPASS = [
  ["c1", "שני הדברים שהכי חשובים לי במקום הבא שלי:"],
  ["c2", "דבר אחד שאני לא מוותר/ת עליו:"],
  ["c3", "שאלות שאני רוצה לשאול בדוכנים:"],
  ["c4", "משהו שאני עדיין מתלבט/ת לגביו:"]
];

const store = {
  get(k, d) { try { const v = localStorage.getItem("makom:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("makom:" + k, JSON.stringify(v)); } catch {} }
};

let S = store.get("state", null) || { step: 0, picks: Q.map(() => []), order: null };
if (!S.order) S.order = Q.map(() => shuffle([0,1,2,3,4]));
let compass = store.get("compass", {});
let checks = store.get("checks", {});
function save() { store.set("state", S); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const icon = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 44 44" fill="none" stroke="var(--${P[k].c})" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k].icon}</svg>`;
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const go = step => { S.step = step; save(); render(); window.scrollTo(0, 0); };

function render() {
  if (S.step === 0) return renderIntro();
  if (S.step <= Q.length) return renderQuestion(S.step - 1);
  renderResults();
}

function renderIntro() {
  app.innerHTML = `
    <section class="stack">
      <div class="chairs"><div class="card-navy">
        <span class="line">נו, כבר יש לכם</span>
        <span class="big">מקום</span>
        <span class="line y">לשנה הבאה?</span>
        <p>כולם מדברים על מקום. אבל על איזה מקום בדיוק? שש שאלות קצרות יעזרו לכם לגלות מה המקום שלכם, ובסוף תקבלו פרופיל אישי ושאלות מוכנות לדוכנים.</p>
        <span class="event" style="flex-direction:column"><b>עושים מקום – כנס מוסדות החינוך העל־יסודי בבנימין</b><span>15.12.26 · ה׳ בטבת</span></span>
      </div></div>
      <p>בכל שאלה אפשר לבחור עד שתי תשובות. אין תשובות נכונות או לא נכונות, יש מקום לכל אחד ואחת.</p>
      <div class="chips">${KEYS.map(k => `<span class="chip" style="background:var(--${P[k].c}-soft);color:var(--${P[k].c})">${icon(k)}${P[k].name}</span>`).join("")}</div>
      <div class="row"><button class="btn" id="start">${S.picks.some(p => p.length) ? "להמשיך מאיפה שעצרתי" : "יאללה, מתחילים"}</button></div>
    </section>`;
  document.getElementById("start").onclick = () => {
    const firstEmpty = S.picks.findIndex(p => !p.length);
    go(firstEmpty === -1 ? Q.length + 1 : firstEmpty + 1);
  };
}

function renderQuestion(i) {
  const [title, opts] = Q[i];
  const picks = S.picks[i];
  app.innerHTML = `
    <section class="stack">
      <div class="progress" aria-hidden="true">${Q.map((_, j) => `<span class="${j <= i ? "done" : ""}"></span>`).join("")}</div>
      <div class="qhead"><span class="eyebrow">שאלה ${i + 1} מתוך ${Q.length}</span><span class="muted" style="font-size:.95rem">אפשר לבחור עד שתי תשובות</span></div>
      <div class="qtitle"><h2 id="qt">${title}</h2><span class="qmarks" aria-hidden="true"><span>?</span><span>?</span><span>?</span></span></div>
      <div class="options" role="group" aria-labelledby="qt">
        ${S.order[i].map(o => {
          const on = picks.includes(o);
          const locked = !on && picks.length >= 2;
          return `<button class="opt${locked ? " locked" : ""}" data-o="${o}" aria-pressed="${on}"><span class="box"></span><span>${opts[o]}</span></button>`;
        }).join("")}
      </div>
      <p class="hint muted" id="hint">${picks.length >= 2 ? "בחרתם שתי תשובות. כדי להחליף, בטלו אחת מהן." : ""}</p>
      <div class="nav">
        <button class="btn ghost" id="back">הקודם</button>
        <button class="btn" id="next" ${picks.length ? "" : "disabled"}>${i === Q.length - 1 ? "למקום שלי" : "הבא"}</button>
      </div>
    </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const o = +b.dataset.o, idx = picks.indexOf(o);
    if (idx > -1) picks.splice(idx, 1);
    else if (picks.length < 2) picks.push(o);
    else { document.getElementById("hint").textContent = "אפשר לבחור עד שתי תשובות. בטלו אחת כדי לבחור אחרת."; return; }
    save(); renderQuestion(i);
    app.querySelector(`.opt[data-o="${o}"]`)?.focus();
  });
  document.getElementById("back").onclick = () => go(S.step - 1);
  document.getElementById("next").onclick = () => go(S.step + 1);
}

function profileCard(k, kicker) {
  const p = P[k], col = `var(--${p.c})`;
  const inCompass = (compass.c3 || "");
  return `
    <article class="profile" style="border-color:${col}">
      <div class="ph">${icon(k)}<div><div class="kicker" style="color:${col}">${kicker}</div><h3>${p.name}</h3></div></div>
      <p><strong>${p.tag}</strong> ${p.text}</p>
      <div class="cols">
        <div><h4>מה כדאי לבדוק?</h4><ul>${p.check.map(c => `<li>${c}</li>`).join("")}</ul></div>
        <div class="ask"><h4>מה לשאול בדוכן?</h4>
          ${p.ask.map(a => `<div class="ask-row"><q>${a}</q><button class="add" style="color:${col}" data-q="${esc(a)}" ${inCompass.includes(a) ? "disabled" : ""}>${inCompass.includes(a) ? "נוסף ✓" : "+ למצפן"}</button></div>`).join("")}
        </div>
      </div>
    </article>`;
}

function renderResults() {
  const count = Object.fromEntries(KEYS.map(k => [k, 0]));
  S.picks.forEach(p => p.forEach(o => count[KEYS[o]]++));
  const max = Math.max(...KEYS.map(k => count[k]));
  const top = KEYS.filter(k => count[k] === max && max > 0);
  const rest = KEYS.filter(k => !top.includes(k)).sort((x, y) => count[y] - count[x]);
  const scale = Math.max(max, 1);

  app.innerHTML = `
    <section class="stack">
      <div class="chairs"><div class="card-navy">
        <div class="awards" aria-hidden="true">${AWARDS}</div>
        <span class="line">${top.length === 1 ? "המקום שלכם:" : "יש לכם מקום"}</span>
        <span class="big" style="font-size:clamp(2.2rem, 9vw, 3.4rem)">${top.length === 1 ? P[top[0]].name : "ליותר מדבר אחד"}</span>
        <span class="line y">${top.length === 1 ? P[top[0]].tag : "וזה בדיוק טוב."}</span>
      </div></div>

      <div class="panel">
        <h3>פרופיל המקום שלי</h3>
        <div class="bars">
          ${KEYS.map(k => `<div class="bar">${icon(k)}
            <div class="lbl"><span>${HEB[k]} – ${P[k].name}</span><div class="track"><div class="fill" style="width:${count[k] / scale * 100}%;background:var(--${P[k].c})"></div></div></div>
            <span class="n">${count[k]}</span></div>`).join("")}
        </div>
      </div>

      ${top.map(k => profileCard(k, top.length > 1 ? "אחד המקומות הבולטים אצלכם" : "בחרתם בעיקר " + HEB[k])).join("")}

      <div class="panel">
        <h3>${top.length > 1 ? "יצא לכם יותר ממקום אחד? מעולה." : "ויש מקום גם לשאר"}</h3>
        <p>כולנו מורכבים מכמה רצונות וצרכים. אפשר לשאוף גבוה וגם להרגיש שייכים, לחשוב מחוץ לקופסה וגם לגדול בסביבה ערכית.</p>
        <p>המטרה היא לא לשים אתכם במשבצת. המטרה היא לעזור לכם לדעת מה לחפש.</p>
      </div>

      <div>
        <h3 style="margin-bottom:8px">שאר המקומות</h3>
        ${rest.map(k => `<details class="more"><summary>${icon(k)}<span>${P[k].name}</span><span class="muted" style="font-weight:400">· ${count[k]} בחירות</span></summary>${profileCard(k, HEB[k])}</details>`).join("")}
      </div>

      <div class="panel" id="compass">
        <h2>רגע לפני הדוכנים: המצפן האישי שלי</h2>
        <p class="muted">מה שתכתבו כאן נשמר בדפדפן הזה. אפשר להעתיק הכול ולשמור בטלפון.</p>
        ${COMPASS.map(([id, l]) => `<div class="field"><label for="${id}">${l}</label><textarea id="${id}" rows="${id === "c3" ? 4 : 2}">${esc(compass[id] || "")}</textarea></div>`).join("")}
        <div class="row"><button class="btn small" id="copy">העתקת המצפן</button><span class="toast" id="toast" role="status"></span></div>
      </div>

      <div class="panel">
        <h2>צ׳ק ליסט פרקטי לכולם</h2>
        <p class="muted">בלי קשר למקום שיצא לכם, את הדברים האלה כדאי לבדוק בכל בית ספר.</p>
        <div class="checklist">
          ${CHECKLIST.map((c, j) => `<label><input type="checkbox" id="ck${j}" ${checks[j] ? "checked" : ""}><span>${c}</span></label>`).join("")}
        </div>
      </div>

      <div class="chairs"><div class="card-navy closing">
        <span class="line">יש הרבה בתי ספר טובים.</span>
        <span class="line y">עכשיו הזמן למצוא את המקום שטוב בשבילכם.</span>
        <span class="event" style="justify-content:center">בבנימין <b>עושים מקום</b> לכולם</span>
      </div></div>
      <div class="row" style="justify-content:center">
        <button class="btn ghost small" id="edit">לשנות תשובות</button>
        <button class="btn ghost small" id="restart">להתחיל מחדש</button>
      </div>
    </section>`;

  COMPASS.forEach(([id]) => document.getElementById(id).addEventListener("input", e => { compass[id] = e.target.value; store.set("compass", compass); }));
  CHECKLIST.forEach((_, j) => document.getElementById("ck" + j).onchange = e => { checks[j] = e.target.checked; store.set("checks", checks); });
  app.querySelectorAll(".add").forEach(b => b.onclick = () => {
    const q = b.dataset.q, ta = document.getElementById("c3");
    ta.value = (ta.value.trim() ? ta.value.trimEnd() + "\n" : "") + "• " + q;
    compass.c3 = ta.value; store.set("compass", compass);
    app.querySelectorAll(".add").forEach(x => { if (x.dataset.q === q) { x.disabled = true; x.textContent = "נוסף ✓"; } });
  });
  document.getElementById("copy").onclick = () => {
    const text = "המצפן האישי שלי\n" + (top.length ? "המקום שלי: " + top.map(k => P[k].name).join(" + ") + "\n\n" : "\n") +
      COMPASS.map(([id, l]) => l + "\n" + (document.getElementById(id).value.trim() || "—")).join("\n\n");
    const toast = document.getElementById("toast");
    navigator.clipboard.writeText(text).then(() => { toast.textContent = "הועתק"; },
      () => { const ta = document.getElementById("c1"); ta.focus(); ta.select(); toast.textContent = "ההעתקה לא עבדה כאן. סמנו את הטקסט והעתיקו ידנית."; });
  };
  document.getElementById("edit").onclick = () => go(1);
  document.getElementById("restart").onclick = function () {
    if (this.dataset.armed) {
      S = { step: 0, picks: Q.map(() => []), order: Q.map(() => shuffle([0,1,2,3,4])) }; go(0);
    } else { this.dataset.armed = "1"; this.textContent = "בטוח? לחצו שוב לאיפוס"; }
  };
}

// Folding-chair pattern from the campaign poster, drawn as an SVG tile
function chair(x, y, r, c, o) {
  return `<g transform="translate(${x} ${y}) rotate(${r} 26 32)" opacity="${o}">
    <rect x="12" y="2" width="28" height="20" rx="4" fill="${c}"/>
    <rect x="12" y="18" width="4" height="44" rx="2" fill="${c}"/><rect x="36" y="18" width="4" height="44" rx="2" fill="${c}"/>
    <path d="M6 32 H46 L42 40 H10 Z" fill="${c}"/>
    <path d="M14 40 L38 62 M38 40 L14 62" stroke="${c}" stroke-width="4" stroke-linecap="round"/></g>`;
}
const CH = [["#3b7ddd",.9],["#8cbcec",.8],["#5aa63c",.85],["#b4d69a",.85],["#f7c234",.85]];
const tile = `<svg xmlns="http://www.w3.org/2000/svg" width="230" height="230" viewBox="0 0 230 230">${[
  [8,6,-18,0],[92,0,14,2],[168,18,-8,4],[30,82,22,3],[118,78,-24,1],[188,104,16,2],[4,158,8,4],[80,160,-12,0],[150,168,26,3]
].map(([x,y,r,i]) => chair(x, y, r, CH[i][0], CH[i][1])).join("")}</svg>`;
document.documentElement.style.setProperty("--chairs", `url("data:image/svg+xml,${encodeURIComponent(tile)}")`);

// Medals and trophy from the campaign video
const AWARDS = `
<svg viewBox="0 0 44 44"><path d="M15 4 L22 18 L29 4" stroke="#3b7ddd" stroke-width="5" fill="none"/><circle cx="22" cy="28" r="12" fill="#f7c234"/><text x="22" y="33" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="14" fill="#1d4562">1</text></svg>
<svg viewBox="0 0 44 44"><path d="M12 6 H32 V16 C32 23 27 27 22 27 C17 27 12 23 12 16 Z" fill="#f7c234"/><path d="M12 9 H6 C6 16 9 18 12 18 M32 9 H38 C38 16 35 18 32 18" stroke="#f7c234" stroke-width="3" fill="none"/><rect x="19" y="27" width="6" height="7" fill="#f7c234"/><rect x="13" y="34" width="18" height="6" rx="2" fill="#3b7ddd"/></svg>
<svg viewBox="0 0 44 44"><circle cx="22" cy="18" r="13" fill="#5aa63c"/><circle cx="22" cy="18" r="8" fill="#b4d69a"/><path d="M15 29 L12 42 L18 38 L22 42 L22 30 M29 29 L32 42 L26 38 L22 42" fill="#5aa63c"/></svg>`;

document.documentElement.dir = "rtl";
document.documentElement.lang = "he";
render();
</script>
</body>
</html>
